name: Sunset Monitor

on:
  schedule:
    # UTC 08:24 = 北京时间 16:24
    - cron: '24 8 * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Test sunsetbot connection
        run: |
          echo "Testing sunsetbot.top..."
          curl -I -L --max-time 20 https://sunsetbot.top/

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Inject ServerChan SendKey
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: |
          sed -i "s/sendKey: \"\"/sendKey: \"${SERVERCHAN_SENDKEY}\"/" settings.yaml

      - name: Run sunset monitor once
        env:
          RUN_ONCE: "true"
        run: |
          go run .
