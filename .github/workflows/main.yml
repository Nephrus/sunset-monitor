name: Sunset Monitor

on:
  schedule:
    # 北京时间每天 16:24
    - cron: '24 8 * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Inject ServerChan SendKey
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: |
          sed -i "s/sendKey: \"\"/sendKey: \"${SERVERCHAN_SENDKEY}\"/" settings.yaml

      - name: Check ServerChan configuration
        run: |
          if grep -q 'sendKey: ""' settings.yaml; then
            echo "ERROR: SendKey injection failed"
            exit 1
          else
            echo "ServerChan SendKey has been injected"
          fi

      - name: Test WeChat notification
        env:
          TEST_PUSH: "true"
        run: |
          go run .

      - name: Run sunset monitor once
        env:
          RUN_ONCE: "true"
        run: |
          go run .
